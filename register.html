<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Battle FF Royale</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">🔥</span>
                <span class="logo-text">Battle <span class="accent">FF</span> Royale</span>
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="login.html" class="nav-link">Login</a>
                <a href="register.html" class="nav-link active">Register</a>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon">🎮</div>
                <h2>Create Account</h2>
                <p>Join Battle FF Royale and start winning!</p>
            </div>
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label>👤 Username</label>
                    <input type="text" id="regUsername" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" id="regEmail" placeholder="Enter email" required>
                </div>
                <div class="form-group">
                    <label>📱 Mobile Number</label>
                    <input type="tel" id="regMobile" placeholder="Enter 10-digit mobile" maxlength="10" required>
                </div>
                <div class="form-group">
                    <label>🔒 Password</label>
                    <input type="password" id="regPassword" placeholder="Enter password" required>
                </div>
                <div class="form-group">
                    <label>🔒 Confirm Password</label>
                    <input type="password" id="regConfirmPassword" placeholder="Confirm password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">🚀 Register Now</button>
            </form>
            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Login here</a></p>
            </div>
        </div>
    </div>

    <script src="js/shared.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
